<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#101827" />
    <meta name="color-scheme" content="dark" />
    <title>iHub</title>
    <style>
      * { box-sizing: border-box; }
      html, body, #shell { width: 100%; height: 100%; margin: 0; }
      body { background: #101827; color: #edf2ff; font-family: Inter, system-ui, sans-serif; }
      #shell { display: flex; flex-direction: column; }
      #status { display: none; min-height: 100%; padding: 32px 24px; align-items: center; justify-content: center; text-align: center; }
      #status.visible { display: flex; }
      #status h1 { margin: 0 0 12px; font-size: 28px; }
      #status p { max-width: 420px; color: #a9b6cc; line-height: 1.6; }
      #ihub-app { display: block; border: 0; width: 100%; height: 100%; flex: 1; background: #fff; }
      #ihub-app.hidden { display: none; }
    </style>
  </head>
  <body>
    <main id="shell">
      <section id="status" class="visible" aria-live="polite">
        <div>
          <h1>iHub</h1>
          <p id="status-message">Opening iHub…</p>
        </div>
      </section>
      <iframe id="ihub-app" class="hidden" title="iHub student opportunities" allow="clipboard-read; clipboard-write"></iframe>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
