name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-lockfile:
    name: Update Bun lockfile for same-repository PRs
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Resolve and commit Bun lockfile
        shell: bash
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          bun install
          if git diff --quiet -- bun.lock; then
            echo "Bun lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore(deps): update Bun lockfile"
          git push origin "HEAD:refs/heads/${BRANCH}"

  verify:
    name: Lint, TypeScript, and production build
    needs: update-lockfile
    if: ${{ always() && (needs.update-lockfile.result == 'success' || needs.update-lockfile.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref || github.event.pull_request.head.sha || github.sha }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: ESLint
        run: bun run lint

      - name: Unit tests
        run: bun run test

      - name: TypeScript check
        run: bun run typecheck

      - name: Production build
        run: bun run build
