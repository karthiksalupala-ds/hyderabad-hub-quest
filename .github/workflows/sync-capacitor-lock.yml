name: Prepare Capacitor lockfile

on:
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "bun.lock"
      - ".github/workflows/sync-capacitor-lock.yml"

permissions:
  contents: read

jobs:
  lockfile:
    name: Generate updated Bun lockfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
      - name: Resolve dependencies and update lockfile
        run: bun install
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: capacitor-bun-lockfile
          path: bun.lock
          if-no-files-found: error
          retention-days: 1
